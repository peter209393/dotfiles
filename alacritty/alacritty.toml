# Alacritty —— macOS / Linux 通用
# 文档: https://alacritty.org/config-alacritty.html
#
# 配色不写在这里,统一由 themes/ 下的文件提供(那些文件是从 ghostty 内置主题
# 生成的,所以两个终端永远是同一套色)。换主题只改下面这一行的文件名:
#   carbonfox / vesper / ayu / flexoki_dark / kanagawa_dragon / catppuccin_mocha
# 想要别的配色: ghostty +list-themes 里挑,再照 themes/ 里的格式生成一份。

[general]
import = ["~/.config/alacritty/themes/carbonfox.toml"]

[window]
dynamic_padding = true
opacity = 1
startup_mode = "Windowed"

[selection]
save_to_clipboard = true

[cursor]
style = "Beam"
thickness = 0.3

[scrolling]
history = 5000
multiplier = 3

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
chars = "\u001b\u0002"
key = "B"
mods = "Control|Command"

[[keyboard.bindings]]
action = "Quit"
key = "Q"
mods = "Control|Command"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "PasteSelection"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "ToggleFullscreen"
key = "F11"
mods = "None"

[[keyboard.bindings]]
action = "Paste"
key = "Paste"
mods = "None"

[[keyboard.bindings]]
action = "Copy"
key = "Copy"
mods = "None"

[[keyboard.bindings]]
action = "ClearLogNotice"
key = "L"
mods = "Control"

[[keyboard.bindings]]
chars = "\f"
key = "L"
mods = "Control"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "PageUp"
mode = "~Alt"
mods = "None"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "PageDown"
mode = "~Alt"
mods = "None"

[[keyboard.bindings]]
action = "ScrollToTop"
key = "Home"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollToBottom"
key = "End"
mode = "~Alt"
mods = "Shift"

[font]
size = 15.0

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Bold Italic"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[terminal]
