monitor = ,preferred,auto,1.5

$mod = ALT
$term = footclient

exec-once = sh -c 'pgrep -x foot >/dev/null || foot --server'
exec-once = noctalia -d
exec-once = fcitx5 -d
exec-once = systemctl --user restart pipewire wireplumber xdg-desktop-portal xdg-desktop-portal-hyprland
exec-once = systemctl --user start hyprpolkitagent

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

general {
    gaps_in = 10
    gaps_out = 20
    border_size = 2
    col.active_border = rgb(cba6f7)
    col.inactive_border = rgb(313244)
    layout = dwindle
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

xwayland {
    force_zero_scaling = true
}

input {
    kb_options = ctrl:nocaps
    repeat_delay = 225
    repeat_rate = 33
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

bind = $mod, Return, exec, $term
bind = $mod SHIFT, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod SHIFT, C, exec, hyprctl reload

bind = $mod, P, exec, noctalia msg panel-toggle launcher
bind = $mod SHIFT, B, exec, noctalia msg bar-toggle
bind = $mod, comma, exec, noctalia msg settings-toggle
bind = $mod CTRL, L, exec, loginctl lock-session

binde = $mod, H, movefocus, l
binde = $mod, J, movefocus, d
binde = $mod, K, movefocus, u
binde = $mod, L, movefocus, r
binde = $mod, Left, movefocus, l
binde = $mod, Down, movefocus, d
binde = $mod, Up, movefocus, u
binde = $mod, Right, movefocus, r

binde = $mod SHIFT, H, movewindow, l
binde = $mod SHIFT, J, movewindow, d
binde = $mod SHIFT, K, movewindow, u
binde = $mod SHIFT, L, movewindow, r
binde = $mod SHIFT, Left, movewindow, l
binde = $mod SHIFT, Down, movewindow, d
binde = $mod SHIFT, Up, movewindow, u
binde = $mod SHIFT, Right, movewindow, r

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, Space, togglefloating
bind = $mod, S, exec, /home/peter/dotfiles/scripts/win-stack.py on
binde = $mod, W, changegroupactive, f
binde = $mod SHIFT, W, changegroupactive, b
bind = $mod, E, exec, /home/peter/dotfiles/scripts/win-stack.py off

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = $mod SHIFT, minus, movetoworkspacesilent, special:scratch
bind = $mod, minus, togglespecialworkspace, scratch

bind = $mod, R, submap, resize
submap = resize
binde = , H, resizeactive, -10 0
binde = , J, resizeactive, 0 10
binde = , K, resizeactive, 0 -10
binde = , L, resizeactive, 10 0
binde = , Left, resizeactive, -10 0
binde = , Down, resizeactive, 0 10
binde = , Up, resizeactive, 0 -10
binde = , Right, resizeactive, 10 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

bindel = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+

bind = , Print, exec, grim - | wl-copy
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod CTRL, S, exec, grim -g "$(slurp)" ~/Pictures/screenshot_$(date +%F_%T).png

bind = $mod, G, exec, /home/peter/dotfiles/scripts/agent-float-toggle.sh

windowrule = float on, match:class ^(Android Emulator)$, match:title (?i)Android Emulator
windowrule = float on, match:class ^(agent-float)$
windowrule = size 400 650, match:class ^(agent-float)$
windowrule = center on, match:class ^(agent-float)$
windowrule = workspace special:agent silent, match:class ^(agent-float)$
