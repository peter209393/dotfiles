# ly 显示管理器配置(install.sh 的 setup_ly 会软链接到 /etc/ly/config.ini)
# 只写覆盖项;未列出的键沿用 ly 默认值,完整说明见 /etc/ly/config.ini.example
# ly 跑在 tty2(systemctl enable ly@tty2.service);
# 裸 tty1 登录仍走 fish/config.fish 末尾的 sway 自动启动回退

# 登录界面不显示系统版本号
hide_version_string = true

# 记住上次选的会话(首次登录用方向键选中 Hyprland,之后自动选中)
save = true
